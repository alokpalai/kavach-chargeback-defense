name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests scripts dashboard

      # The guard tests use synthetic fixtures on purpose: they verify the
      # splitting and windowing logic, which must hold regardless of data, and
      # they run without the 1.3 GB competition dataset. A failure here means
      # a split leaked or a feature window reached forward in time.
      - name: Guard tests
        run: pytest -q
